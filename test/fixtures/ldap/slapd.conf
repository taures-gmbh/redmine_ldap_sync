#
# LDAP Defaults
#

# See ldap.conf(5) for details
# This file should be world readable but not world writable.

#BASE	dc=example,dc=com
#URI	ldap://ldap.example.com ldap://ldap-master.example.com:666

#SIZELIMIT	12
#TIMELIMIT	15
#DEREF		never

# TLS certificates (needed for GnuTLS)
#TLS_CACERT	/etc/ssl/certs/ca-certificates.crt

# Sample OpenLDAP configuration file for Redmine LDAP test server
#
#ucdata-path     /var/lib/ldap/ucdata
# OpenLDAP 2.5 removed the bdb/hdb backends; mdb (lmdb) is the only remaining
# writable backend. ppolicy no longer ships a .schema file either — the pwdPolicy
# objectClass used by the account-locked fixtures comes with the overlay module.
moduleload back_mdb.la
moduleload memberof.la
moduleload dynlist.la
moduleload ppolicy.la

include   /etc/ldap/schema/core.schema
include   /etc/ldap/schema/cosine.schema
include   /etc/ldap/schema/inetorgperson.schema
include   /etc/ldap/schema/openldap.schema
include   /etc/ldap/schema/nis.schema
include   /etc/ldap/schema/dyngroup.schema

pidfile         /var/run/slapd/slapd.pid
argsfile        /var/run/slapd/slapd.args

database        mdb
maxsize         268435456
suffix          "dc=redmine,dc=org"
rootdn          "cn=admin,dc=redmine,dc=org"
rootpw          password
directory       /var/lib/ldap
# Indices to maintain
index   objectClass     eq

overlay                 memberof
memberof-group-oc       groupOfNames
memberof-member-ad	    member
memberof-memberof-ad    memberOf

overlay         dynlist
dynlist-attrset groupOfURLs memberURL member