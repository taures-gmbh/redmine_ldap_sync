name: release

on:
  push:
    # Matches the existing convention: lightweight tags named vX.Y.Z
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  # A tag that does not pass the suite must not become a release, so run the whole
  # thing - every Redmine version plus the browser tests - against the tagged commit.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag must match the version in init.rb
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plugin="$(sed -n "s/^[[:space:]]*version '\(.*\)'.*/\1/p" init.rb)"
          echo "tag=$tag  init.rb=$plugin"
          if [ "$tag" != "$plugin" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with init.rb ($plugin). Redmine shows the init.rb value under Administration → Plugins, so a release whose tag says something else is a release nobody can identify."
            exit 1
          fi

      - name: Build the release notes from the commits
        run: |
          # NOT --generate-notes: GitHub builds those from merged pull requests, and
          # this repo commits straight to master, so it yields nothing but a compare
          # link. The commit subjects are the changelog here.
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "### Changes since $prev"
              echo
              git log --no-merges --pretty='- %s' "$prev..$GITHUB_REF_NAME"
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            else
              echo '### Changes'
              echo
              git log --no-merges --pretty='- %s' "$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "--- notes ---"; cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag refuses to invent a tag that is not already pushed; if the
          # release exists this fails rather than silently overwriting notes someone
          # has edited by hand.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
